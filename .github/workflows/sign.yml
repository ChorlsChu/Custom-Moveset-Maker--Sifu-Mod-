name: build-and-sign

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish SifuMovesetEditor.csproj -c Release -o publish

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: SifuMovesetEditor-unsigned
          if-no-files-found: error
          path: publish/SifuMovesetEditor.exe

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'SifuMovesetEditor'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: 'signed-output'

      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: SifuMovesetEditor-signed
          if-no-files-found: error
          path: signed-output/
