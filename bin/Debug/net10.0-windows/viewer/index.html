<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #11111b; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; position: relative; }
        #info {
            position: absolute; top: 8px; left: 8px;
            color: #6c7086; font-size: 11px; pointer-events: none;
            z-index: 10;
        }
        #no-data {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #45475a; font-size: 14px; text-align: center;
        }
        #no-data .icon { font-size: 48px; margin-bottom: 12px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="container">
        <div id="info"></div>
        <div id="no-data">
            <div class="icon">&#9760;</div>
            Select an animation from the library<br>to preview it here
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="viewer.js"></script>
</body>
</html>
